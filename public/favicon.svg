<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Obsidian Team Rocket Uniform Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="50%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <!-- Crimson Team Rocket "R" Gradient -->
    <linearGradient id="rocketRed" x1="16" y1="10" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ff3b3b" />
      <stop offset="55%" stopColor="#ef4444" />
      <stop offset="100%" stopColor="#b91c1c" />
    </linearGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ef4444" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#475569" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#dc2626" stopOpacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow for the R -->
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" floodColor="#ef4444" floodOpacity="0.45" />
    </filter>
  </defs>

  <!-- Rounded Badge Base -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#rimGrad)" strokeWidth="2.5" />

  <!-- Subtle Dark Pokéball Background Motif -->
  <circle cx="32" cy="32" r="22" stroke="#1e293b" strokeWidth="2" opacity="0.7" />
  <line x1="4" y1="32" x2="60" y2="32" stroke="#1e293b" strokeWidth="2.5" opacity="0.75" />
  <circle cx="32" cy="32" r="6" fill="#0f172a" stroke="#1e293b" strokeWidth="2" opacity="0.75" />

  <!-- Iconic Team Rocket "R" -->
  <g filter="url(#glow)">
    <path
      fill="url(#rocketRed)"
      stroke="#fecaca"
      strokeWidth="0.75"
      strokeLinejoin="round"
      d="M16 11H36.5C44.5 11 49.5 15.6 49.5 22.8C49.5 28.4 46.1 32.5 40.4 33.9L50.5 53H38.2L29.8 35.5H26.5V53H16V11ZM26.5 19.5V27.2H35C37.9 27.2 39.6 25.6 39.6 23.3C39.6 21 37.9 19.5 35 19.5H26.5Z"
    />
  </g>
</svg>